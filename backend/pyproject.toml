[tool.pytest.ini_options]
# Run from backend/: put backend/ on the import path so `import app` works.
pythonpath = ["."]
testpaths = ["tests"]
# Treat every `async def test_...` as an async test, no decorator needed.
asyncio_mode = "auto"
# One event loop for the whole run. The DB engine is shared across tests,
# and asyncpg connections break if they're used from a different loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
